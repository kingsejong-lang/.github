name: 기능 제안
description: 새 문법, 표준 라이브러리 함수, 도구 기능을 제안해 주세요
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        방향이 아직 정해지지 않은 아이디어는 [Discussions](https://github.com/kingsejong-lang/kingsejong-lang/discussions)에서 먼저 이야기하면 좋습니다.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 풀고 싶나요?
      description: 지금 무엇이 불편하거나 불가능한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 새 문법이라면 KingSejong 코드로 쓰는 모습을 보여 주세요.
      render: text
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
  - type: checkboxes
    id: contribute
    attributes:
      label: 참여
      options:
        - label: 이 기능을 직접 구현해 PR 을 보낼 수 있습니다
